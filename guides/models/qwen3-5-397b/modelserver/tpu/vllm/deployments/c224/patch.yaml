apiVersion: disaggregatedset.x-k8s.io/v1
kind: DisaggregatedSet
metadata:
  name: pd-disagg-tpu-qwen35
spec:
  roles:
    - name: prefill
      spec:
        replicas: 2
        leaderWorkerTemplate:
          workerTemplate:
            spec:
              containers:
                - name: modelserver
                  env:
                    - name: TPU_RUNNER_STAGE_TIMING_MODE
                      value: "on"
                    - name: TPU_SCHED_SINGLE_STEP_PREFILL
                      value: "0"
    - name: decode
      spec:
        replicas: 4
        leaderWorkerTemplate:
          workerTemplate:
            spec:
              containers:
                - name: modelserver
                  env:
                    - name: TPU_SCHED_MK_MAX_RUNNING
                      value: "8"
                    - name: TPU_RUNNER_STAGE_TIMING_MODE
                      value: "on"
                    - name: VLLM_TPU_QWEN35_MK_MODE
                      value: ep
                    - name: VLLM_TPU_QWEN35_MTP_MK_VERIFY_BUCKETS
                      value: "4,8,12,16,20,24,32,40,48,56,64"
