apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Low-latency operating point (`c208`): 2 prefill + 5 decode single-host tpu7x slices (28 chips),
# TP8 + DCP4 megakernel decode (TP mode), `--max-num-seqs=3` per decode host.
resources:
  - ../../base

components:
  - ../../../../../../../../recipes/modelserver/components/disaggregatedset-schema
  # Uncomment to switch from AgentX synthetic MTP acceptance (3.39) to real rejection sampling:
  # - ../../components/real-sampling

patches:
  - path: patch.yaml
