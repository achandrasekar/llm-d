apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Balanced operating point (`c224`): 2 prefill + 4 decode single-host tpu7x slices (24 chips),
# TP8 + DCP4 megakernel decode (EP mode), `--max-num-seqs=8` per decode host.
resources:
  - ../../base

components:
  - ../../../../../../../../recipes/modelserver/components/disaggregatedset-schema
  # Uncomment to switch from AgentX synthetic MTP acceptance (3.39) to real rejection sampling:
  # - ../../components/real-sampling

patches:
  - path: patch.yaml
