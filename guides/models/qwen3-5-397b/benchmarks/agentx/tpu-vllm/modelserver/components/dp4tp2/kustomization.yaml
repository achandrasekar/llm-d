apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Switches the DisaggregatedSet from the TP8+DCP4 megakernel decode profile (`tp8`) to the
# multi-port attention DP=4 x TP=2 decode profile (`dp4tp2`, used by the `c600` 4P3D point).
components:
  - ../../../../../../../../recipes/modelserver/components/disaggregatedset-schema

patches:
  - path: patch-prefill.yaml
  - path: patch-decode.yaml
