# Prefill role overrides for the `dp4tp2` (`c600`, 4P3D) operating point:
#   - 4 prefill replicas, active-ports annotation pinned to :8000 (decode exposes :8000..:8003).
#   - Fine-grained compile buckets + safetensors prefetch load strategy.
#   - Raiden KV transfer targets DCP=1 (`TPU_RAIDEN_DST_SHARDS=2`, no destination DCP extra config).
#   - XLA rematerialization floor (`--xla_tpu_rematerialization_min_size_in_bytes=1099511627776`).
apiVersion: disaggregatedset.x-k8s.io/v1
kind: DisaggregatedSet
metadata:
  name: pd-disagg-tpu-qwen35
spec:
  roles:
    - name: prefill
      spec:
        replicas: 4
        leaderWorkerTemplate:
          workerTemplate:
            metadata:
              annotations:
                llm-d.ai/active-ports: "8000"
            spec:
              containers:
                - name: modelserver
                  args:
                    - |
                      set -euo pipefail
                      rm -f /tmp/libtpu_lockfile* /dev/shm/libtpu_lockfile* 2>/dev/null || true
                      CACHE_ROOT="/.cache"
                      mkdir -p "$CACHE_ROOT"
                      export JAX_COMPILATION_CACHE_DIR="$CACHE_ROOT/jax_cache"
                      export JAX_COMPILER_CACHE_DIR="$CACHE_ROOT/jax_cache"
                      export TORCH_TPU_CACHE_DIR="$CACHE_ROOT/torch_tpu_cache"
                      export TORCH_TPU_INTERNAL_TIER2_COMPILATION_CACHE="$CACHE_ROOT/torch_tpu_cache"
                      export TORCH_TPU_INTERNAL_TIER3_COMPILATION_CACHE_ROOT="$CACHE_ROOT/torch_tpu_tier3"
                      export TORCH_TPU_TIER3_COMPILATION_CACHE_ROOT="$CACHE_ROOT/torch_tpu_tier3"
                      export VLLM_CACHE_ROOT="$CACHE_ROOT/vllm"
                      export VLLM_XLA_CACHE_PATH="$CACHE_ROOT/xla_cache"
                      if [[ "$POD_IP" == *":"* ]]; then
                        HOST_ADDR="::"
                        export VLLM_HOST_IP="[$POD_IP]"
                      else
                        HOST_ADDR="0.0.0.0"
                        export VLLM_HOST_IP="$POD_IP"
                      fi
                      exec vllm serve Qwen/Qwen3.5-397B-A17B-FP8 \
                        --served-model-name Qwen/Qwen3.5-397B-A17B-FP8 Qwen3.5-397B-A17B-FP8 \
                        --default-chat-template-kwargs='{"enable_thinking":true}' \
                        --tool-call-parser=qwen3_coder \
                        --reasoning-parser=qwen3 \
                        --api-server-count=1 \
                        --trust-remote-code \
                        --seed=42 \
                        --max-model-len=262144 \
                        --disable-custom-all-reduce \
                        --gpu-memory-utilization=0.92 \
                        --kv-cache-dtype=fp8 \
                        --quantization=fp8 \
                        --language-model-only \
                        --limit-mm-per-prompt='{"image":0,"video":0}' \
                        --no-disable-hybrid-kv-cache-manager \
                        --attention-backend=CUSTOM \
                        --mamba-cache-mode=align \
                        --enable-prompt-tokens-details \
                        --no-enable-log-requests \
                        --disable-access-log-for-endpoints=/health,/metrics,/v1/models \
                        --shutdown-timeout=45 \
                        --enable-prefix-caching \
                        --scheduler-cls=vllm_torchtpu.core.prefix_aware_scheduler.PrefixAwareScheduler \
                        --disable-sliding-window \
                        --host="$HOST_ADDR" \
                        --port=8000 \
                        --load-format=safetensors \
                        --safetensors-load-strategy=prefetch \
                        --max-num-batched-tokens=8192 \
                        --long-prefill-token-threshold=262144 \
                        --max-num-seqs=32 \
                        --block-size=2176 \
                        --tensor-parallel-size=1 \
                        --pipeline-parallel-size=8 \
                        --prefill-context-parallel-size=1 \
                        --cp-kv-cache-interleave-size=1 \
                        --data-parallel-size=1 \
                        --data-parallel-size-local=1 \
                        --speculative-config='{"method":"mtp","num_speculative_tokens":1}' \
                        --compilation-config='{
                          "backend":"vllm_torchtpu.compilation.tpu_compiler.TpuCompilerAdaptor",
                          "compile_sizes":[8,16,32,64,128,256,512,1024,1536,1664,2048,2176,3840,4352,6016,6528,8192],
                          "inductor_compile_config":{"enable_auto_functionalized_v2":false,"size_asserts":false,"alignment_asserts":false,"scalar_asserts":false}
                        }' \
                        --kv-transfer-config='{
                          "kv_connector":"TPUMultiConnector",
                          "kv_connector_module_path":"vllm_torchtpu.distributed.kv_transfer.tpu_multi_connector",
                          "kv_role":"kv_producer",
                          "kv_connector_extra_config":{"connectors":[
                            {"kv_connector":"TPURaidenConnector","kv_connector_module_path":"vllm_torchtpu.distributed.kv_transfer.tpu_connector",
                             "kv_role":"kv_producer","kv_port":14579},
                            {"kv_connector":"TPURaidenOffloadingConnector","kv_connector_module_path":"vllm_torchtpu.offload.raiden_connector",
                             "kv_role":"kv_both","kv_connector_extra_config":{"cpu_bytes_to_use":550000000000,"raiden_controller_port":47800}}
                          ]}
                        }'
                  env:
                    - name: LIBTPU_INIT_ARGS
                      value: " --xla_tpu_use_minor_sharding_for_major_trivial_input=true\
                        \ --xla_tpu_enable_sparse_core_collective_offload_reduce_scatter=false\
                        \ --xla_tpu_ars_combiner_threshold_in_bytes=0\
                        \ --xla_tpu_enable_async_collective_merger=false\
                        \ --xla_enable_async_all_gather=true\
                        \ --xla_tpu_enable_sparse_core_collective_offload_all_gather=true\
                        \ --xla_tpu_sparse_core_all_gather_offload_min_size_in_bytes=262144\
                        \ --xla_tpu_rematerialization_min_size_in_bytes=1099511627776"
                    - {name: TPU_RAIDEN_DST_SHARDS, value: "2"}
                    - {name: TPU_RPA_PREFILL_BLOCKS, value: "256,16,1024,1"}
                    - {name: TPU_PP_INFLIGHT_COST, $patch: delete}
                    - {name: TPU_SCHED_PAW_PROMOTE_WARMEST, $patch: delete}
