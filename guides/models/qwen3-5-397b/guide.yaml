name: qwen3-5-397b

# Which model server runs on which accelerator. `validated` = covered by a
# nightly E2E workflow; `community` = an overlay exists but is not run nightly;
# `unsupported` must link a tracking issue. A missing cell means unsupported.
# Keys must match env.static ACCELERATOR_TYPE / MODEL_SERVER values; `model`
# is the model the accelerator's overlay serves (used for MODEL on llm-d.ai);
# `notes` (optional, one line) fills the Notes column of the support table.
support:
  engines: {vllm: vLLM}
  accelerators:
    tpu:
      label: Google TPU v7x
      notes: >-
        GKE only · Torch TPU vLLM (SemiAnalysis AgentX recipe) · 6 to 8 single-host `tpu7x` `2x2x1` slices
        (24 to 32 chips) by `DEPLOYMENT` (`c88`, `c208`, `c224`, `c368` default, `c600`) · xPyD `DisaggregatedSet`
        with PP=8 prefill + 550 GB host-DRAM KV offload, Raiden P/D transfer, and TP8+DCP4 megakernel or DP4×TP2 decode
      model: Qwen/Qwen3.5-397B-A17B-FP8
      engines: {vllm: community}

env:
  static:
    REPO_ROOT: $(realpath $(git rev-parse --show-toplevel))

    GUIDE_NAME: qwen3-5-397b
    NAMESPACE: llm-d-qwen3-5-397b

    # Prometheus monitoring is opt-in: set MONITORING=true (requires the
    # monitoring stack) to run the deploy.monitoring* steps.
    MONITORING: {default: "false", values: ["false", "true"]}
    MONITORING_VALUES: {default: ""}

    ACCELERATOR_TYPE: {default: tpu, values: [tpu]}
    MODEL_SERVER: {default: vllm, values: [vllm]}
    # Pareto operating point on the SemiAnalysis AgentX curve (see Operating Points):
    #   c88  = 1P5D (24 chips, TP8+DCP4 megakernel decode, ultra-low ITL)
    #   c208 = 2P5D (28 chips, TP8+DCP4 megakernel decode, low ITL)
    #   c224 = 2P4D (24 chips, TP8+DCP4 megakernel decode, balanced)
    #   c368 = 3P5D (32 chips, TP8+DCP4 megakernel decode, high throughput, default)
    #   c600 = 4P3D (28 chips, multi-port DP4xTP2 decode, maximum throughput)
    DEPLOYMENT:
      default: c368
      values:
        - c88
        - c208
        - c224
        - c368
        - c600

    MODEL: {default: "Qwen/Qwen3.5-397B-A17B-FP8", comment: "the model every deployment serves"}

  source: ["${REPO_ROOT}/guides/env.sh # defines GAIE_VERSION, LWS_VERSION, ROUTER_CHART_VERSION, router chart URLs, and CURL_TEST_IMAGE"]

prerequisites:
  clone:
    - skip_in: [ci]
      run: |
        export BRANCH=main
        git clone https://github.com/llm-d/llm-d.git && cd llm-d && git checkout ${BRANCH}

  gaie:
    - run: |
        # GAIE_URL is automatically calculated from GAIE_VERSION at ${REPO_ROOT}/guides/env.sh
        kubectl apply -f https://github.com/kubernetes-sigs/gateway-api-inference-extension/${GAIE_URL}/v1-manifests.yaml
  # Every operating point runs prefill and decode as an LWS DisaggregatedSet.
  # skip_in ci: the nightly clusters already run LWS, and a second release would collide.
  lws:
    - skip_in: [ci]
      run: |
        # helm upgrade never updates CRDs, so apply the chart's CRDs first (see LWS
        # "Upgrade by Helm"); this upgrades them on clusters that run an older LWS.
        helm pull oci://registry.k8s.io/lws/charts/lws --version=${LWS_VERSION} --untar
        kubectl apply --server-side --force-conflicts -f lws/crds
        helm upgrade --install lws oci://registry.k8s.io/lws/charts/lws \
          --version=${LWS_VERSION} \
          --namespace lws-system --create-namespace \
          --set enableDisaggregatedSet=true \
          --wait --timeout 300s
  namespace:
    - run: kubectl create namespace ${NAMESPACE} --dry-run=client -o yaml | kubectl apply -f -
  secrets:
    - skip_in: [ci]
      run: |
        kubectl create secret generic llm-d-hf-token \
          --from-literal="HF_TOKEN=${HF_TOKEN}" \
          --namespace "${NAMESPACE}" \
          --dry-run=client -o yaml | kubectl apply -f -

deploy:
  router_values:
    - run: |
        export ROUTER_BASE_VALUES="${REPO_ROOT}/guides/recipes/router/base.values.yaml"
        export ROUTER_VALUES="${REPO_ROOT}/guides/models/${GUIDE_NAME}/router/${DEPLOYMENT}.values.yaml"

  monitoring_values:
    - when: {MONITORING: ["true"]}
      run: export MONITORING_VALUES="-f ${REPO_ROOT}/guides/recipes/router/features/monitoring.values.yaml"

  standalone:
    - run: |
        helm install ${GUIDE_NAME} \
          ${ROUTER_STANDALONE_CHART} \
          -f ${ROUTER_BASE_VALUES} \
          ${MONITORING_VALUES} \
          -f ${ROUTER_VALUES} \
          -n ${NAMESPACE} --version ${ROUTER_CHART_VERSION}

  modelserver:
    - run: |
        kubectl apply -n ${NAMESPACE} \
          -k ${REPO_ROOT}/guides/models/${GUIDE_NAME}/modelserver/${ACCELERATOR_TYPE}/${MODEL_SERVER}/deployments/${DEPLOYMENT}

  monitoring:
    # PodMonitors for the prefill and decode model servers (c600 scrapes all 4 decode DP rank ports)
    - when: {MONITORING: ["true"]}
      run: |
        if [[ "${DEPLOYMENT}" == "c600" ]]; then
          kubectl apply -n ${NAMESPACE} -k ${REPO_ROOT}/guides/models/${GUIDE_NAME}/monitoring/multi-port
        else
          kubectl apply -n ${NAMESPACE} -k ${REPO_ROOT}/guides/models/${GUIDE_NAME}/monitoring
        fi

verify:
  endpoint:
    standalone:
      - run: export IP=$(kubectl get service ${GUIDE_NAME}-epp -n ${NAMESPACE} -o jsonpath='{.spec.clusterIP}')
  tests:
    request:
      - run: |
          kubectl run curl-test --rm -i --restart=Never \
            --image=${CURL_TEST_IMAGE} \
            --namespace="${NAMESPACE}" \
            --env="IP=${IP}" \
            --env="MODEL=${MODEL}" \
            -- /bin/sh -c 'curl -sS -X POST "http://${IP}/v1/completions" -H "Content-Type: application/json" -d "{\"model\": \"${MODEL}\", \"prompt\": \"Explain how a simple agent loop works in 3 sentences.\"}"'
    served_model:
      - run: |
          # The router must reach a model server that serves MODEL and returns tokens
          kubectl run serve-check --rm -i --restart=Never \
            --image=${CURL_TEST_IMAGE} \
            --namespace="${NAMESPACE}" \
            --env="IP=${IP}" \
            --env="MODEL=${MODEL}" \
            -- /bin/sh -c 'R=$(curl -sS -X POST "http://${IP}/v1/completions" -H "Content-Type: application/json" -d "{\"model\": \"${MODEL}\", \"prompt\": \"Say hello.\", \"max_tokens\": 16}")
              echo "${R}" | grep -q "\"model\":\"${MODEL}\"" && echo "${R}" | grep -q "\"choices\"" \
                && echo "OK: ${MODEL} served through the router" \
                || { echo "FAIL: ${R}"; exit 1; }'

cleanup:
  modelserver:
    - run: kubectl delete -n ${NAMESPACE} -k ${REPO_ROOT}/guides/models/${GUIDE_NAME}/modelserver/${ACCELERATOR_TYPE}/${MODEL_SERVER}/deployments/${DEPLOYMENT}
  rest:
    - run: helm uninstall ${GUIDE_NAME} -n ${NAMESPACE}
    - run: |
        kubectl delete -n ${NAMESPACE} -k ${REPO_ROOT}/guides/models/${GUIDE_NAME}/monitoring/multi-port --ignore-not-found=true
        kubectl delete -n ${NAMESPACE} -k ${REPO_ROOT}/guides/models/${GUIDE_NAME}/monitoring --ignore-not-found=true
    - skip_in: [ci]
      run: kubectl delete namespace ${NAMESPACE}
